name: JaT CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./apps/api[dev]"
      - run: make api-lint api-type api-test
      - run: cd apps/api && python -m alembic upgrade head --sql > /dev/null
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: npm --prefix apps/web ci
      - run: make web-lint web-type web-test web-build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jat-api:ci apps/api
      - run: docker build -t jat-web:ci apps/web
