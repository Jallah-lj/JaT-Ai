name: jat
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jat
      POSTGRES_USER: jat
      POSTGRES_PASSWORD: 20064 # Development only; override outside local use.
    ports: ["5432:5432"]
    volumes: ["jat_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jat -d jat"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jat_postgres:
